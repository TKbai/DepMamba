data_dir: "/home/ac/data/bai/DepMamba-main/datasets/"
train_gender: both
test_gender: both

model: DepMamba
dataset: dvlog   # 默认值，可被 launch.json 覆盖
train: true
tqdm_able: true
epochs: 120
batch_size: 16
learning_rate: 1e-5

if_wandb: false
save_dir: "/home/ac/data/bai/DepMamba-main/savefile/"
device:
  - "cuda"

# ---------------------------
# dataset-specific training cfg
# ---------------------------
dvlog_train:
  epochs: 120
  learning_rate: 1e-5
  weight_decay: 0.0
  early_stop_patience: 999

  lambda_sparse_peak: 0.05
  lambda_cont_peak: 0.005
  lambda_mil_peak: 0.10
  lambda_comp_peak: 0.020

  mil_topk_ratio: 0.10
  comp_topk_ratio: 0.10

  proposal_mil_weight: 0.1
  proposal_mil_topk_ratio: 0.1

lmvd_train:
  epochs: 60
  learning_rate: 1e-5
  weight_decay: 1.0e-4
  early_stop_patience: 12

  lambda_sparse_peak: 0.05
  lambda_cont_peak: 0.005
  lambda_mil_peak: 0.04
  lambda_comp_peak: 0.008

  mil_topk_ratio: 0.10
  comp_topk_ratio: 0.10

# ---------------------------
# D-Vlog model cfg
# ---------------------------
mmmamba:
  audio_input_size: 25
  video_input_size: 136
  mm_input_size: 256
  mm_output_sizes: [256]
  fusion_output_sizes: [128]
  dropout: 0.1

  selector_alpha: 0.7
  selector_tau: 1.0
  selector_hard: false
  selector_use_gumbel: false
  selector_comp_weight: 0.3
  selector_win_sizes: [7, 15, 31]

  use_gate: true
  causal: false
  attn_heads: 1

  use_evidence_attn: true
  attn_stride: 4

  attn_topk_ratio_a: 0.35
  attn_topk_ratio_v: 0.35
  attn_min_tokens_a: 4
  attn_min_tokens_v: 4
  attn_max_tokens_a: 24
  attn_max_tokens_v: 24

  cross_beta_a: 0.1
  cross_beta_v: 0.1

  selector_enable_proposals: true
  selector_build_proposals_in_train: true
  selector_proposal_win_sizes: [8, 16, 32]
  selector_proposal_stride_ratio: 0.5
  selector_proposal_comp_weight: 0.3
  selector_max_proposals: 12

  proposal_attn_topk_ratio_a: 0.2
  proposal_attn_topk_ratio_v: 0.2
  proposal_attn_min_props_a: 2
  proposal_attn_min_props_v: 2
  proposal_attn_max_props_a: 6
  proposal_attn_max_props_v: 6
  proposal_pooling: "mean"

  final_pooling: "mean_plus_proposal"
  proposal_cls_topk_ratio_a: 0.2
  proposal_cls_topk_ratio_v: 0.2
  proposal_cls_min_props_a: 2
  proposal_cls_min_props_v: 2
  proposal_cls_max_props_a: 6
  proposal_cls_max_props_v: 6

  mamba_config:
    d_state: 12
    expand: 4
    d_conv: 4
    bidirectional: false

  mamba_config:
    d_state: 12
    expand: 4
    d_conv: 4
    bidirectional: false

# ---------------------------
# LMVD model cfg
# ---------------------------
mmmamba_lmvd:
  audio_input_size: 128
  video_input_size: 136
  mm_input_size: 192
  mm_output_sizes: [256]
  fusion_output_sizes: [128]
  dropout: 0.2

  selector_alpha: 0.8
  selector_tau: 1.0
  selector_hard: false
  selector_use_gumbel: false
  selector_comp_weight: 0.3
  selector_win_sizes: [7, 15, 31]

  use_gate: true
  causal: false
  attn_heads: 1

  use_evidence_attn: true
  attn_stride: 4

  attn_topk_ratio_a: 0.35
  attn_topk_ratio_v: 0.35
  attn_min_tokens_a: 4
  attn_min_tokens_v: 4
  attn_max_tokens_a: null
  attn_max_tokens_v: null

  cross_beta_a: 0.1
  cross_beta_v: 0.1

  mamba_config:
    d_state: 16
    expand: 2
    d_conv: 4
    bidirectional: false